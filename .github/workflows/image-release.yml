name: Release Images

on:
  push:
    tags:
      - "exivity-*"
  workflow_dispatch:

jobs:
  release-inputs:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      maintenance: ${{ steps.guard.outputs.maintenance }}
      images: ${{ steps.inventory.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify maintenance images before allowing any legacy promotion
        id: guard
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_READ_TOKEN }}
        run:
          node .github/scripts/maintenance-guard.mjs charts "$GITHUB_REF_NAME"
      - id: inventory
        run: echo "images=$(jq -c . release-images.json)" >> "$GITHUB_OUTPUT"

  image-release:
    needs: release-inputs
    permissions:
      contents: read
      packages: read
    if: needs.release-inputs.outputs.maintenance == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: ${{ fromJSON(needs.release-inputs.outputs.images) }}
    steps:
      - name: release images with tags
        uses: exivity/actions/retag-image@main
        with:
          source-name: ${{ matrix.name }}
          source-tag: main
          target-name: ${{ matrix.name }}
          target-tag: ${{ github.ref_name }}
          target-user: ${{ secrets.DOCKER_HUB_USER }}
          target-password: ${{ secrets.DOCKER_HUB_TOKEN }}
