name: retag-image
on:
  workflow_dispatch:
    inputs:
      source-registry:
        description: Source image registry
        required: true
        default: ghcr.io
      target-registry:
        description: Target image registry
        required: true
        default: docker.io
      source-name:
        description: Source image name
        required: true
      source-tag:
        description: Source image tag
        required: true
      target-name:
        description: Target image name
        required: true
      target-tag:
        description: Target image tag
        required: true

permissions:
  contents: read
  packages: read

jobs:
  retag-image:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse manual replacement of planned maintenance images
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_READ_TOKEN }}
          TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          if [[ "$TARGET_TAG" =~ ^exivity-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            PLAN_TAG="maintenance-plan-v${BASH_REMATCH[1]}"
            if gh api "repos/exivity/exivity/git/ref/tags/$PLAN_TAG" >/dev/null 2>/tmp/plan-error; then
              echo 'This release is controlled by a maintenance plan; use its publisher.' >&2
              exit 1
            fi
            grep -q 'HTTP 404' /tmp/plan-error
          fi
      - name: release images with tags
        uses: exivity/actions/retag-image@main
        with:
          source-registry: ${{ inputs.source-registry }}
          target-registry: ${{ inputs.target-registry }}
          source-name: ${{ inputs.source-name }}
          source-tag: ${{ inputs.source-tag }}
          target-name: ${{ inputs.target-name }}
          target-tag: ${{ inputs.target-tag }}
          target-user: ${{ secrets.DOCKER_HUB_USER }}
          target-password: ${{ secrets.DOCKER_HUB_TOKEN }}
