name: Release Charts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify all maintenance release images
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run:
          node .github/scripts/maintenance-guard.mjs charts "$GITHUB_REF_NAME"

      - name: Check previously published maintenance chart
        id: existing
        if: steps.guard.outputs.maintenance == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          VERSION=$(jq -r .version .maintenance-release.json)
          TAG="exivity-${VERSION#v}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /tmp/chart-release.json 2>/tmp/chart-release-error; then
            mkdir -p /tmp/previous-chart
            gh release download "$TAG" --pattern maintenance-plan.sha256 --dir /tmp/previous-chart
            test "$(cat /tmp/previous-chart/maintenance-plan.sha256)" = "$MAINTENANCE_PLAN_HASH"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            grep -q 'HTTP 404' /tmp/chart-release-error
          fi

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          helm repo add exivity-bitnami https://exivity.github.io/bitnami-charts

      - name: Run chart-releaser
        if: steps.existing.outputs.skip != 'true'
        uses: exivity/chart-releaser-action@v1.1.0
        env:
          CR_TOKEN: "${{ secrets.GH_BOT_TOKEN }}"

      - name: Record the maintenance plan on the published chart
        if:
          steps.guard.outputs.maintenance == 'true' &&
          steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          VERSION=$(jq -r .version .maintenance-release.json)
          printf '%s\n' "$MAINTENANCE_PLAN_HASH" > maintenance-plan.sha256
          gh release upload "exivity-${VERSION#v}" maintenance-plan.sha256
