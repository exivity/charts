name: Release Charts

on:
  workflow_dispatch:
    inputs:
      maintenance_tag:
        description:
          "Existing approved maintenance tag to retry; leave empty for an
          ordinary release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  helm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate an explicit maintenance retry tag
        if: inputs.maintenance_tag != ''
        env:
          MAINTENANCE_TAG: ${{ inputs.maintenance_tag }}
        run: |
          [[ "$MAINTENANCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'A maintenance retry requires an existing vX.Y.Z tag.' >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref:
            ${{ inputs.maintenance_tag && format('refs/tags/{0}',
            inputs.maintenance_tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify all maintenance release images
        id: guard
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_READ_TOKEN }}
          MAINTENANCE_TAG: ${{ inputs.maintenance_tag }}
          RELEASE_REF: ${{ inputs.maintenance_tag || github.ref_name }}
        run: |
          test -n "$GH_TOKEN" || {
            echo 'Configure the read-only MAINTENANCE_READ_TOKEN secret.' >&2
            exit 1
          }
          if [[ -n "$MAINTENANCE_TAG" ]]; then
            node -e 'const m = require("./.maintenance-release.json"); const tag = process.env.MAINTENANCE_TAG; if (m.version !== tag || m.planRef !== `maintenance-plan-${tag}`) throw Error("The selected tag is not the requested maintenance package")'
          fi
          node .github/scripts/maintenance-guard.mjs charts "$RELEASE_REF"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          helm repo add exivity-bitnami https://exivity.github.io/bitnami-charts

      - name: Run chart-releaser
        if: steps.guard.outputs.maintenance != 'true'
        uses: exivity/chart-releaser-action@v1.1.0
        env:
          CR_TOKEN: "${{ secrets.GH_BOT_TOKEN }}"

      - name: Install the pinned maintenance chart releaser
        if: steps.guard.outputs.maintenance == 'true'
        run: |
          CR_DIR=$(mktemp -d)
          curl --fail --silent --show-error --location https://github.com/helm/chart-releaser/releases/download/v1.1.1/chart-releaser_1.1.1_linux_amd64.tar.gz | tar -xz -C "$CR_DIR" cr
          echo "$CR_DIR" >> "$GITHUB_PATH"

      - name: Publish the exact maintenance chart and update its index
        if: steps.guard.outputs.maintenance == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          CR_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          # Older approved tags have a publisher that does not create this directory.
          mkdir -p .cr-index
          bash .github/scripts/publish-maintenance-chart.sh
