name: Release Charts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify all maintenance release images
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run:
          node .github/scripts/maintenance-guard.mjs charts "$GITHUB_REF_NAME"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          helm repo add exivity-bitnami https://exivity.github.io/bitnami-charts

      - name: Run chart-releaser
        if: steps.guard.outputs.maintenance != 'true'
        uses: exivity/chart-releaser-action@v1.1.0
        env:
          CR_TOKEN: "${{ secrets.GH_BOT_TOKEN }}"

      - name: Install the pinned maintenance chart releaser
        if: steps.guard.outputs.maintenance == 'true'
        run: |
          CR_DIR=$(mktemp -d)
          curl --fail --silent --show-error --location https://github.com/helm/chart-releaser/releases/download/v1.1.1/chart-releaser_1.1.1_linux_amd64.tar.gz | tar -xz -C "$CR_DIR" cr
          echo "$CR_DIR" >> "$GITHUB_PATH"

      - name: Publish the exact maintenance chart and update its index
        if: steps.guard.outputs.maintenance == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          CR_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: bash .github/scripts/publish-maintenance-chart.sh
