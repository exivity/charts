apiVersion: v1
kind:       ConfigMap
metadata:
  name: {{ include "exivity.fullname" $ -}}-lock
  labels:
    app.kubernetes.io/component: proximity-api
    {{- include "exivity.labels" $ | indent 4 }}
data:
  exivity.lock: |-
                {
                    "version": "{{ .Chart.Version }}",
                    "components": {
                        "exivity-helm-chart": {
                            "ref": "{{ .Chart.Version }}",
                            "hash": "{{ .Chart.Description }}"
                        }
                    }
                }
